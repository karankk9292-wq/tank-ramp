<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Off Ramp</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#08080a;color:#f5c400;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:100vw}
  #hud{flex:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:#0e0e11;border-bottom:2px solid #f5c400}
  #count{white-space:nowrap}
  button#mute{margin:0;padding:4px 9px;font-size:11px;letter-spacing:.06em;border-radius:6px;background:transparent;color:#f5c400;border:1px solid #f5c400;pointer-events:auto;flex:none}
  button#mute.off{color:#888;border-color:#555}
  #status{color:#fff;text-align:right}
  #stage{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(8,8,10,.84);text-align:center;padding:20px;z-index:5}
  .hidden{display:none!important}
  h1{margin:0;font-size:44px;letter-spacing:.14em;color:#f5c400;line-height:1}
  .bar{width:200px;height:10px;margin:4px 0 10px;
    background:repeating-linear-gradient(135deg,#f5c400 0 10px,#111 10px 20px)}
  .ov p{margin:0;font-size:17px;color:#e8e8e8;line-height:1.5}
  .ov small{margin-top:8px;color:#888;font-size:12px}
  button{font:inherit;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#111;background:#f5c400;border:0;
    border-radius:10px;padding:14px 34px;margin-top:14px;font-size:18px;cursor:pointer}
  button:active{transform:scale(.97)}
  #endTitle{font-size:34px}
  .lbl{margin-top:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#888}
  .sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:330px}
  button.sw{width:32px;height:32px;padding:0;margin:0;border-radius:50%;border:3px solid #111;box-shadow:0 0 0 2px transparent}
  button.sw.sel{box-shadow:0 0 0 3px #fff}
  #cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;
    font-size:130px;font-weight:900;letter-spacing:.04em;color:#f5c400;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.7)}
  #cd.pop{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){#cd.pop{animation:none}}
  #ctl{display:none}
  body.touch #ctl{display:flex;flex:none;justify-content:space-between;align-items:center;height:160px;
    padding:8px 22px calc(8px + env(safe-area-inset-bottom));background:#0e0e11}
  #stick{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(245,196,0,.10);border:2px solid rgba(245,196,0,.5);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#f5c400;opacity:.9;pointer-events:none}
  #fire{width:104px;height:104px;border-radius:50%;margin:0;padding:0;font-size:17px;background:#e5484d;color:#fff;border:3px solid #ffd0d0;touch-action:none}
  #fire.on{background:#ff7b7f}
  body.rot #wrap{position:fixed;left:0;top:0;transform-origin:0 0;max-width:none}
  body.land.touch #ctl{position:absolute;left:0;right:0;bottom:0;height:auto;background:none;pointer-events:none;z-index:4;
    padding:8px 22px 10px 22px}
  body.land.touch #ctl>*{pointer-events:auto}
  body.compact #hud{position:absolute;top:0;left:0;right:0;z-index:3;background:none;border:0;pointer-events:none;font-size:12px;
    padding:6px 16px 0 16px;text-shadow:0 1px 3px #000}
  body.compact #stick{width:118px;height:118px}
  body.compact #knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  body.compact #fire{width:94px;height:94px}
  body.compact .ov{gap:5px;padding:10px}
  body.compact h1{font-size:30px}
  body.compact .bar{height:8px;margin:2px 0 4px}
  body.compact .ov p{font-size:14px;line-height:1.35}
  body.compact .ov small{display:none}
  body.compact .lbl{margin-top:4px}
  body.compact button{padding:9px 28px;margin-top:6px;font-size:16px}
  body.compact button.sw{padding:0;margin:0}
  body.compact button#mute{padding:4px 9px;margin:0;font-size:11px}
  body.compact #endTitle{font-size:26px}
  body.compact #cd{font-size:90px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="count">Tanks on pad: 4</span><span id="status">Shove them down the ramp</span><button id="mute" type="button">Sound on</button></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="start" class="ov">
      <h1>OFF RAMP</h1>
      <div class="bar"></div>
      <p>Bump to shove.</p>
      <p>Shells hit harder.</p>
      <p>The bottom of the ramp is out.</p>
      <div class="lbl">Your tank</div>
      <div class="sws" id="sw1"></div>
      <button id="go">Start</button>
      <small>Stick + Fire &nbsp;·&nbsp; WASD / arrows + Space</small>
    </div>
    <div id="cd" class="hidden"></div>
    <div id="end" class="ov hidden">
      <h1 id="endTitle">Down the ramp</h1>
      <div class="bar"></div>
      <div class="lbl">Your tank</div>
      <div class="sws" id="sw2"></div>
      <button id="again">Rematch</button>
    </div>
  </div>
  <div id="ctl">
    <div id="stick"><div id="knob"></div></div>
    <button id="fire">Fire</button>
  </div>
</div>
<script>
(()=>{
'use strict';
// ---------- world: wide pad, open ramp on all four sides ----------
const HX=210,HY=120,RL=80,R=14,W=2*(HX+RL),H=2*(HY+RL),CX=W/2,CY=H/2; // pad half-extents, ramp length
const LV=[60,105,HX]; // ramp half-widths: level 1 (4 tanks), level 2 (3 tanks), full (last two); capped per side
const STUB_L=20,STUB_T=8; // one-tank-wide stop wall at the middle of each lip
const SPEED_P=135,SPEED_AI=100,KD=4,SLIDE=270;
const SHELL_V=340,SHELL_KNOCK=340,BUMP_CAP=105,BUMP_ACC=700,KV_MAX=480;
const FIRE_CD_P=0.55;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const over=t=>Math.max(Math.abs(t.x-CX)-HX,Math.abs(t.y-CY)-HY); // how far past the nearest pad edge (<0 inside)
const onRamp=t=>over(t)>0;
const laneX=()=>Math.min(rh,HY),laneY=()=>Math.min(rh,HX); // half-widths of the left/right and top/bottom ramps
function mouths(){ // centre of the open lane either side of each stop wall
  const lx=STUB_L+(laneX()-STUB_L)/2,ly=STUB_L+(laneY()-STUB_L)/2,out=[];
  for(const s of [-1,1])for(const sg of [-1,1])out.push({x:CX+s*HX,y:CY+lx*sg},{x:CX+ly*sg,y:CY+s*HY});
  return out;
}
function nearestMouth(t){let b=null,bd=1e9;for(const m of mouths()){const d=Math.hypot(t.x-m.x,t.y-m.y);if(d<bd){bd=d;b=m;}}return [b,bd];}
function mdist(t){return onRamp(t)?-over(t):nearestMouth(t)[1];}   // small = close to falling off
function mouthDir(t){
  if(onRamp(t))return outDir(t);
  const [m]=nearestMouth(t),dx=m.x-t.x,dy=m.y-t.y,l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];
}
function outDir(t){const dx=t.x-CX,dy=t.y-CY;return Math.abs(dx)-HX>=Math.abs(dy)-HY?[Math.sign(dx)||1,0]:[0,Math.sign(dy)||1];}
// stop walls (axis-aligned rects)
const STUBS=[];
for(const [ux,uy] of [[1,0],[-1,0],[0,1],[0,-1]]){
  if(ux!==0){const x0=CX+(ux>0?HX:-HX-STUB_T);STUBS.push({x0,x1:x0+STUB_T,y0:CY-STUB_L,y1:CY+STUB_L});}
  else{const y0=CY+(uy>0?HY:-HY-STUB_T);STUBS.push({x0:CX-STUB_L,x1:CX+STUB_L,y0,y1:y0+STUB_T});}
}

// ---------- state ----------
let state='start'; // start | play | over
const PALETTE=['#ffd21f','#ef4444','#3b82f6','#a855f7','#22c55e','#f97316','#ec4899','#06b6d4'];
const darker=c=>'#'+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*0.55).toString(16).padStart(2,'0')).join('');
let playerColor=PALETTE[0],cdT=0,flashT=0,rampFlash=0,bumpT=-1;
// ---------- sound (synthesised, no files) ----------
let AC=null,master=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('offramp-mute')==='1';}catch(e){}
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}
function noise(dur,vol,freq,kind,delay){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t0=AC.currentTime+(delay||0),src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;f.type=kind||'lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t0,Math.random()*0.5);src.stop(t0+dur+0.02);
}
const sfx={
  fire(me){const v=me?1:0.55;noise(0.12,0.28*v,1800,'bandpass');tone(240,60,0.13,'sawtooth',0.18*v);},
  hit(){tone(170,40,0.2,'square',0.28);noise(0.14,0.3,900,'lowpass');},
  bump(){tone(95,45,0.09,'triangle',0.28);},
  fall(){tone(760,90,0.75,'sawtooth',0.16);noise(0.35,0.2,420,'lowpass',0.55);},
  beep(){tone(440,440,0.14,'square',0.16);},
  go(){tone(880,880,0.4,'square',0.18);tone(1320,1320,0.4,'triangle',0.1);},
  widen(){tone(180,640,0.4,'triangle',0.18);},
  click(){tone(620,620,0.05,'square',0.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.16,'square',0.14,i*0.11));tone(1047,1047,0.5,'triangle',0.12,0.46);},
  lose(){[392,330,262].forEach((f,i)=>tone(f,f*0.97,0.22,'sawtooth',0.14,i*0.2));tone(130,50,0.8,'sawtooth',0.14,0.6);}
};
function ring(x,y,r0,r1,c,life){parts.push({x,y,vx:0,vy:0,life,max:life,c,ring:true,r0,r1});}
let rh=LV[0],rhT=LV[0],widenMsg=0;
let tanks=[],shells=[],parts=[],time=0,shake=0,overAt=0,overShownAt=0,playerWon=false;
const input={kx:0,ky:0,jx:0,jy:0,fire:false};
const keys={};

function mk(i,x,y,color,dark,isP){
  return {id:i,x,y,face:Math.atan2(CY-y,CX-x),dx:0,dy:0,kx:0,ky:0,stun:0,cd:0.5+Math.random()*0.7,flash:0,
    alive:true,fallT:0,fx:0,fy:1,color,dark,isPlayer:isP,lowT:0,tgt:null,rt:Math.random()*0.3,wob:Math.random()*6.28};
}
function reset(){
  const J=()=>(Math.random()-0.5)*20,D=70; // everyone starts D in from their own edge
  const ai=PALETTE.filter(c=>c!==playerColor);
  tanks=[
    mk(0,CX,CY+HY-D,playerColor,darker(playerColor),true),
    mk(1,CX-HX+D+J(),CY+J(),ai[0],darker(ai[0]),false),
    mk(2,CX+HX-D+J(),CY+J(),ai[1],darker(ai[1]),false),
    mk(3,CX+J(),CY-HY+D+J()/2,ai[2],darker(ai[2]),false)
  ];
  shells=[];parts=[];time=0;shake=0;playerWon=false;rh=rhT=LV[0];widenMsg=0;flashT=0;rampFlash=0;
}
reset();

// ---------- AI ----------
function think(t,dt){
  t.rt-=dt;
  if(t.rt<=0||!t.tgt||!t.tgt.alive){
    t.rt=0.3+Math.random()*0.2;
    let best=null;
    for(const o of tanks) if(o!==t&&o.alive&&(!best||mdist(o)<mdist(best))) best=o; // closest to a ramp
    t.tgt=best;
  }
  const g=t.tgt;
  if(onRamp(t)){
    // Actually on a ramp: panic and climb. Exception: a shallow overshoot while still
    // shoving someone who is further down the slope (easy to climb out of there).
    const depth=over(t)/RL;
    if(!(g&&g.alive&&mdist(g)<mdist(t)-4&&depth<0.3)){
      const o=outDir(t);
      if(o[0]!==0){t.dx=-o[0];t.dy=clamp((CY-t.y)/70,-.4,.4);}
      else{t.dy=-o[1];t.dx=clamp((CX-t.x)/70,-.4,.4);}
      return;
    }
  }
  if(!g){t.dx=t.dy=0;return;}
  // frame: u = the target's outward (toward-its-ramp) direction, v = lateral
  const u=mouthDir(g),v=[-u[1],u[0]];
  const ga=(g.x-CX)*u[0]+(g.y-CY)*u[1],gl=(g.x-CX)*v[0]+(g.y-CY)*v[1];
  const ma=(t.x-CX)*u[0]+(t.y-CY)*u[1],ml=(t.x-CX)*v[0]+(t.y-CY)*v[1];
  const ex=gl-ml,ey=ga-ma;
  let ax,lat;
  if(ey>12){
    // target is further out than me: line up laterally while moving toward its ramp, drive into it
    t.lowT=0;
    lat=clamp(ex/16,-1,1);ax=Math.abs(ex)<32?1:0.45;
    t.dx=u[0]*ax+v[0]*lat;t.dy=u[1]*ax+v[1]*lat;
  }else{
    // I'm the low tank. Don't run for the walls: face the threat, meet it, shoot it, dodge.
    t.lowT=(t.lowT||0)+dt;
    if(t.lowT<4){
      const ph=((time*0.9+t.wob)%1+1)%1;
      if(ph<0.3&&Math.abs(ex)<70){lat=clamp(ex/16,-1,1)*0.5;ax=-0.6;}
      else{
        if(!t.sd||time>t.sdT){t.sd=Math.random()<0.5?-1:1;t.sdT=time+0.7+Math.random()*0.8;}
        let sd=t.sd;
        if(over({x:t.x+v[0]*sd*30,y:t.y+v[1]*sd*30})>-R-24)sd=-sd;
        lat=sd;ax=0;
      }
      t.dx=u[0]*ax+v[0]*lat;t.dy=u[1]*ax+v[1]*lat;
      if(mdist(t)<70){const dx=CX-t.x,dy=CY-t.y,m=Math.hypot(dx,dy)||1;t.dx=dx/m*0.8;t.dy=dy/m*0.8;} // stay off the lip
    }else{
      // flank: slip round to the inner side of the target, then shove outward
      const lane=ex>0?-1:1,a=ga-30,l=gl+lane*60;
      const tx=clamp(CX+u[0]*a+v[0]*l,CX-HX+R+10,CX+HX-R-10),ty=clamp(CY+u[1]*a+v[1]*l,CY-HY+R+10,CY+HY-R-10);
      t.dx=clamp((tx-t.x)/16,-1,1);t.dy=clamp((ty-t.y)/16,-1,1);
    }
  }
  t.dx+=Math.sin(time*2.3+t.wob)*0.12;
}
function aiShoot(t){
  if(t.cd>0||onRamp(t))return;
  for(const o of tanks){
    if(o===t||!o.alive)continue;
    const vx=o.x-t.x,vy=o.y-t.y,d=Math.hypot(vx,vy);
    if(d<40||d>300)continue;
    if(Math.abs(angDiff(Math.atan2(vy,vx),t.face))<0.28){fire(t);t.cd=0.8+Math.random()*0.6;return;}
  }
}

// ---------- actions ----------
function fire(t){
  t.cd=t.isPlayer?FIRE_CD_P:t.cd;
  const ca=Math.cos(t.face),sa=Math.sin(t.face);
  shells.push({x:t.x+ca*(R+5),y:t.y+sa*(R+5),vx:ca*SHELL_V,vy:sa*SHELL_V,owner:t,life:1.3});
  t.kx-=ca*35;t.ky-=sa*35;
  spark(t.x+ca*(R+8),t.y+sa*(R+8),4,'#fff2a8',90);
  ring(t.x+ca*(R+6),t.y+sa*(R+6),3,13,'#fff2a8',0.15);
  sfx.fire(t.isPlayer);
}
function spark(x,y,n,c,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(0.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.25,max:0.55,c});}
}
function kill(t){
  const o=outDir(t);t.fx=o[0];t.fy=o[1];
  t.alive=false;t.fallT=0;t.dx=t.dy=0;
  shake=Math.max(shake,5);
  spark(t.x,t.y,14,'#ffffff',140);
  ring(t.x,t.y,8,70,'#ffffff',0.5);ring(t.x,t.y,4,40,t.color,0.4);
  flashT=Math.max(flashT,t.isPlayer?0.6:0.35);
  sfx.fall();
}
function limitKv(t,m){const k=Math.hypot(t.kx,t.ky);if(k>m){t.kx*=m/k;t.ky*=m/k;}}
function insideShellBlocked(x,y){
  const ax=Math.abs(x-CX),ay=Math.abs(y-CY);
  if(ax>HX+RL+8||ay>HY+RL+8)return true;
  if((ax>HX&&ay>laneX())||(ay>HY&&ax>laneY()))return true; // edge walls / ramp side walls
  for(const r of STUBS)if(x>r.x0&&x<r.x1&&y>r.y0&&y<r.y1)return true;
  return false;
}

// ---------- simulation ----------
function step(dt){
  if(state==='start')return;
  if(state==='count'){cdT-=dt;if(cdT<=0.6)state='play';return;}
  if(cdT>0)cdT-=dt;
  time+=dt;
  const P=tanks[0];
  for(const t of tanks){
    if(!t.alive)continue;
    if(t.isPlayer){
      if(state==='play'){
        let ix=clamp(input.kx+input.jx,-1,1),iy=clamp(input.ky+input.jy,-1,1);
        const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
        t.dx=ix;t.dy=iy;
        if(input.fire&&t.cd<=0)fire(t);
      }else{t.dx=t.dy=0;}
    }else if(time<1.0){t.dx=t.dy=0; // brief standoff before the AIs engage
    }else{
      think(t,dt);
      const m=Math.hypot(t.dx,t.dy);if(m>1){t.dx/=m;t.dy/=m;}
      aiShoot(t);
    }
    // move
    const sp=t.isPlayer?SPEED_P:SPEED_AI,k=t.stun>0?0.35:1;
    let vx=t.dx*sp*k+t.kx,vy=t.dy*sp*k+t.ky;
    if(onRamp(t)){ // downhill pull, outward along the ramp axis
      const o=outDir(t),pull=SLIDE*Math.min(1,over(t)/RL);
      vx+=o[0]*pull;vy+=o[1]*pull;
    }
    t.x+=vx*dt;t.y+=vy*dt;
    const f=Math.exp(-KD*dt);t.kx*=f;t.ky*=f;
    t.stun-=dt;t.cd-=dt;t.flash-=dt;
    const dm=Math.hypot(t.dx,t.dy);
    t.dustT=(t.dustT||0)-dt;
    if(dm>0.3&&t.dustT<=0){t.dustT=0.07;parts.push({x:t.x-Math.cos(t.face)*11+(Math.random()-0.5)*6,y:t.y-Math.sin(t.face)*11+(Math.random()-0.5)*6,vx:(Math.random()-0.5)*14,vy:(Math.random()-0.5)*14,life:0.35,max:0.35,c:'#b9bcc6',sz:4,grow:true});}
    if(dm>0.2)t.face+=angDiff(Math.atan2(t.dy,t.dx),t.face)*Math.min(1,16*dt);
  }
  // tank vs tank: the tank nearer the centre shoves the outer one toward its ramp (asymmetric on purpose)
  for(let it=0;it<2;it++){
    for(let i=0;i<tanks.length;i++)for(let j=i+1;j<tanks.length;j++){
      const a=tanks[i],b=tanks[j];
      if(!a.alive||!b.alive)continue;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const min=R*2;
      if(d>=min)continue;
      if(d<0.001){dx=0.01;dy=0.01;d=0.014;}
      const ra=mdist(a),rb=mdist(b);
      let upA;
      if(Math.abs(ra-rb)>=6)upA=ra>rb;
      else{ // roughly level: whoever is driving harder into the other is the pusher
        const pa=(a.dx*dx+a.dy*dy)/d,pb=-(b.dx*dx+b.dy*dy)/d;
        upA=Math.abs(pa-pb)>0.05?pa>pb:(ra>rb||(ra===rb&&a.id<b.id));
      }
      const up=upA?a:b,dn=upA?b:a;
      const nx=(dn.x-up.x)/d,ny=(dn.y-up.y)/d;
      const pen=min-Math.hypot(dn.x-up.x,dn.y-up.y);
      dn.x+=nx*pen*0.8;dn.y+=ny*pen*0.8;
      up.x-=nx*pen*0.2;up.y-=ny*pen*0.2;
      if(it===0){
        if(time-bumpT>0.14){bumpT=time;sfx.bump();spark((a.x+b.x)/2,(a.y+b.y)/2,5,'#e8e8e8',90);}
        // shove direction: away from pusher, biased hard toward the loser's nearest ramp
        const o=mouthDir(dn);
        let sx=nx*0.7+o[0]*0.75,sy=ny*0.7+o[1]*0.75;const sm=Math.hypot(sx,sy)||1;sx/=sm;sy/=sm;
        const along=dn.kx*sx+dn.ky*sy;
        if(along<BUMP_CAP){const a2=Math.min(BUMP_ACC*dt,BUMP_CAP-along);dn.kx+=sx*a2;dn.ky+=sy*a2;}
        limitKv(dn,KV_MAX);
      }
    }
  }
  // walls: corridor sides / pad corners, stop walls; out when the end of any ramp is touched
  const Mx=HX-R,My=HY-R,Lx=laneX()-R,Ly=laneY()-R;
  for(const t of tanks){
    if(!t.alive)continue;
    let ax=t.x-CX,ay=t.y-CY;
    if(Math.abs(ax)>Mx&&Math.abs(ay)>Lx){ // past the pad edge on x, but outside the left/right ramp lane
      if(Math.abs(ax)-Mx<Math.abs(ay)-Lx){t.x=CX+Math.sign(ax)*Mx;if(t.kx*ax>0)t.kx*=-0.3;}
      else{t.y=CY+Math.sign(ay)*Lx;if(t.ky*ay>0)t.ky*=-0.3;}
    }
    ax=t.x-CX;ay=t.y-CY;
    if(Math.abs(ay)>My&&Math.abs(ax)>Ly){ // past the pad edge on y, but outside the top/bottom ramp lane
      if(Math.abs(ay)-My<Math.abs(ax)-Ly){t.y=CY+Math.sign(ay)*My;if(t.ky*ay>0)t.ky*=-0.3;}
      else{t.x=CX+Math.sign(ax)*Ly;if(t.kx*ax>0)t.kx*=-0.3;}
    }
    for(const r of STUBS){
      const cx=clamp(t.x,r.x0,r.x1),cy=clamp(t.y,r.y0,r.y1);
      let dx=t.x-cx,dy=t.y-cy;const d=Math.hypot(dx,dy);
      if(d<R){
        if(d<0.001){dx=t.x<(r.x0+r.x1)/2?-1:1;dy=0;}else{dx/=d;dy/=d;}
        t.x=cx+dx*R;t.y=cy+dy*R;
        const vn=t.kx*dx+t.ky*dy;if(vn<0){t.kx-=vn*1.3*dx;t.ky-=vn*1.3*dy;}
      }
    }
    if(Math.abs(t.x-CX)+R>=HX+RL||Math.abs(t.y-CY)+R>=HY+RL)kill(t); // touching the bottom of a ramp is out
  }
  // shells
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    parts.push({x:s.x,y:s.y,vx:0,vy:0,life:0.18,max:0.18,c:'#ffe9a0',sz:5});
    let dead=s.life<=0||insideShellBlocked(s.x,s.y);
    if(dead&&s.life>0)spark(s.x,s.y,3,'#cfcfcf',60);
    if(!dead)for(const t of tanks){
      if(!t.alive||t===s.owner)continue;
      if(Math.hypot(t.x-s.x,t.y-s.y)<R+3){
        const m=Math.hypot(s.vx,s.vy);
        t.kx+=s.vx/m*SHELL_KNOCK;t.ky+=s.vy/m*SHELL_KNOCK;limitKv(t,KV_MAX);
        t.stun=0.3;t.flash=0.12;shake=Math.max(shake,2.5);
        spark(s.x,s.y,10,'#ffd27a',170);ring(s.x,s.y,4,30,'#ffd27a',0.3);sfx.hit();dead=true;break;
      }
    }
    if(dead)shells.splice(i,1);
  }
  // falling tanks, particles
  for(const t of tanks)if(!t.alive){t.fallT+=dt;t.x+=t.fx*140*dt;t.y+=t.fy*140*dt;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  shake=Math.max(0,shake-dt*14);
  // ramps grow as tanks fall: level 1 with 4 tanks, level 2 with 3, full width for the last two
  {
    const n=tanks.filter(t=>t.alive).length,lvl=n>=4?0:n===3?1:2;
    if(LV[lvl]>rhT){rhT=LV[lvl];widenMsg=2;rampFlash=1;sfx.widen();}
    if(rh<rhT)rh=Math.min(rhT,rh+70*dt);
    if(widenMsg>0)widenMsg-=dt;
    if(rampFlash>0)rampFlash-=dt*1.4;
    if(flashT>0)flashT-=dt*2.5;
  }
  // result
  if(state==='play'){
    const alive=tanks.filter(t=>t.alive).length;
    if(!P.alive){state='over';playerWon=false;overAt=time+0.9;sfx.lose();}
    else if(alive===1){
      state='over';playerWon=true;overAt=time+0.6;sfx.win();
      for(let i=0;i<46;i++){const a=Math.random()*6.283,sp=60+Math.random()*180;
        parts.push({x:P.x,y:P.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.9+Math.random()*0.6,max:1.5,c:PALETTE[i%PALETTE.length],sz:5});}
    }
  }
  if(state==='over'&&!$('#end').classList.contains('hidden')===false&&time>=overAt){
    $('#endTitle').textContent=playerWon?'Pad is yours':'Down the ramp';
    $('#end').classList.remove('hidden');overShownAt=performance.now();
  }
}

// ---------- static art ----------
const S=2,bg=document.createElement('canvas');bg.width=W*S;bg.height=H*S;
(function(){
  const g=bg.getContext('2d');g.scale(S,S);
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  g.fillStyle='#050506';g.fillRect(0,0,W,H);
  // solid block (corner blocks + corridor side walls)
  g.fillStyle='#1b1c20';g.fillRect(0,0,W,H);
  // pad
  g.fillStyle='#34363b';g.fillRect(CX-HX,CY-HY,2*HX,2*HY);
  for(let i=0;i<2600;i++){
    const x=CX-HX+rnd()*2*HX,y=CY-HY+rnd()*2*HY,s=0.5+rnd()*1.3;
    g.fillStyle=rnd()<0.5?'rgba(255,255,255,'+(0.03+rnd()*0.05)+')':'rgba(0,0,0,'+(0.1+rnd()*0.12)+')';
    g.fillRect(x,y,s,s);
  }
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;
  for(const k of [-1,1]){
    g.beginPath();g.moveTo(CX+k*HX/3,CY-HY);g.lineTo(CX+k*HX/3,CY+HY);g.stroke();
    g.beginPath();g.moveTo(CX-HX,CY+k*HY/3);g.lineTo(CX+HX,CY+k*HY/3);g.stroke();
  }
  g.strokeStyle='rgba(245,196,0,.10)';g.lineWidth=2;g.beginPath();g.arc(CX,CY,46,0,6.283);g.stroke();
  // pad edge wall (ramps are drawn over this each frame, they change width)
  g.strokeStyle='#4a4d55';g.lineWidth=3;g.strokeRect(CX-HX-1.5,CY-HY-1.5,2*HX+3,2*HY+3);
})();
function drawRamps(){
  for(let k=0;k<4;k++){
    ctx.save();ctx.translate(CX,CY);ctx.rotate(k*Math.PI/2);
    const HALF=k%2?HX:HY,END=HALF+RL,rh=k%2?laneX():laneY(); // this side: edge, ramp end, lane half-width
    ctx.save();ctx.beginPath();ctx.rect(-rh,HALF-3,2*rh,RL+3);ctx.clip();
    ctx.fillStyle='#f5c400';ctx.fillRect(-rh,HALF-3,2*rh,RL+3);
    ctx.fillStyle='#111';
    for(let y0=HALF-12;y0<END;y0+=26){
      ctx.beginPath();ctx.moveTo(-rh,y0);ctx.lineTo(0,y0+Math.min(34,rh*0.5+10));ctx.lineTo(rh,y0);ctx.lineTo(rh,y0+13);ctx.lineTo(0,y0+13+Math.min(34,rh*0.5+10));ctx.lineTo(-rh,y0+13);ctx.closePath();ctx.fill();
    }
    const gr=ctx.createLinearGradient(0,HALF,0,END);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.4)');
    ctx.fillStyle=gr;ctx.fillRect(-rh,HALF,2*rh,RL);
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-rh,HALF-1.5,2*rh,3);
    if(rampFlash>0){ctx.fillStyle='rgba(255,255,255,'+(Math.min(1,rampFlash)*0.55)+')';ctx.fillRect(-rh,HALF,2*rh,RL);}
    ctx.fillStyle='#000';ctx.fillRect(-rh,END-3,2*rh,3);
    ctx.strokeStyle='#4a4d55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-rh,HALF);ctx.lineTo(-rh,END);ctx.moveTo(rh,HALF);ctx.lineTo(rh,END);ctx.stroke();
    ctx.restore();
  }
  for(const r of STUBS){
    ctx.fillStyle='#9aa0ab';ctx.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
    ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.strokeRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
    ctx.fillStyle='rgba(255,255,255,.35)';
    if(r.x1-r.x0>r.y1-r.y0)ctx.fillRect(r.x0+1,r.y0+1,r.x1-r.x0-2,2);else ctx.fillRect(r.x0+1,r.y0+1,2,r.y1-r.y0-2);
  }
}

// ---------- render ----------
const canvas=$('#c'),ctx=canvas.getContext('2d');
let sc=1,ox=0,oy=0;
function resize(){
  const st=$('#stage'),dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=Math.max(1,Math.round(st.clientWidth*dpr)),ch=Math.max(1,Math.round(st.clientHeight*dpr));
  canvas.width=cw;canvas.height=ch;
  sc=Math.min(cw/W,ch/H);ox=(cw-W*sc)/2;oy=(ch-H*sc)/2;
}
new ResizeObserver(resize).observe($('#stage'));addEventListener('resize',resize);resize();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawTank(t){
  ctx.save();ctx.translate(t.x,t.y);
  if(!t.alive){const s=Math.max(0.05,1-t.fallT/0.8);ctx.scale(s,s);ctx.globalAlpha=Math.max(0,1-t.fallT/0.8);}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,3,16,14,0,0,6.283);ctx.fill();
  ctx.rotate(t.face);
  ctx.lineWidth=2;ctx.strokeStyle='#000';
  ctx.fillStyle='#17181b';rr(-15,-14,30,7,3);ctx.fill();ctx.stroke();rr(-15,7,30,7,3);ctx.fill();ctx.stroke();
  ctx.fillStyle=t.color;rr(-13,-9,26,18,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(-12,-8,6,16);
  ctx.fillStyle='#202226';rr(4,-2.5,17,5,1.5);ctx.fill();ctx.stroke();
  ctx.fillStyle=t.dark;ctx.beginPath();ctx.arc(0,0,7,0,6.283);ctx.fill();ctx.stroke();
  if(t.flash>0){ctx.fillStyle='rgba(255,255,255,.7)';rr(-13,-9,26,18,4);ctx.fill();}
  ctx.restore();
  if(t.isPlayer&&t.alive){
    const b=Math.sin(time*6)*1.5;
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(t.x,t.y-R-6+b);ctx.lineTo(t.x-5,t.y-R-14+b);ctx.lineTo(t.x+5,t.y-R-14+b);ctx.closePath();ctx.fill();ctx.stroke();
  }
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#08080a';ctx.fillRect(0,0,canvas.width,canvas.height);
  const sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  ctx.setTransform(sc,0,0,sc,ox+sx*sc,oy+sy*sc);
  ctx.drawImage(bg,0,0,W,H);
  drawRamps();
  for(const t of tanks)if(t.alive)drawTank(t);
  for(const s of shells){
    ctx.fillStyle='rgba(255,230,120,.35)';ctx.beginPath();ctx.arc(s.x,s.y,7,0,6.283);ctx.fill();
    ctx.fillStyle='#fff7c2';ctx.beginPath();ctx.arc(s.x,s.y,3.5,0,6.283);ctx.fill();
  }
  for(const t of tanks)if(!t.alive&&t.fallT<0.8)drawTank(t);
  for(const p of parts){
    const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;
    if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=1+3*a;ctx.beginPath();ctx.arc(p.x,p.y,p.r0+(p.r1-p.r0)*(1-a),0,6.283);ctx.stroke();}
    else{const z=p.sz||3,g=p.grow?z*(2-a):z;ctx.fillStyle=p.c;ctx.fillRect(p.x-g/2,p.y-g/2,g,g);}
  }
  ctx.globalAlpha=1;
  if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.4,flashT*0.4)+')';ctx.fillRect(0,0,W,H);}
}

// ---------- HUD ----------
let lastCount=-1,lastStatus='';
function hud(){
  const n=tanks.filter(t=>t.alive).length;
  if(n!==lastCount){lastCount=n;$('#count').textContent='Tanks on pad: '+n;}
  const P=tanks[0];let s;
  if(state==='count')s='Get ready';
  else if(state==='over')s=playerWon?'Pad is yours':'Down the ramp';
  else if(P.alive&&onRamp(P))s='Climb. The ramp has you.';
  else if(widenMsg>0)s='Ramps widen';
  else s='Shove them down the ramp';
  if(s!==lastStatus){lastStatus=s;$('#status').textContent=s;}
}

// ---------- flow ----------
function startGame(skip){
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
  reset();$('#start').classList.add('hidden');$('#end').classList.add('hidden');
  if(skip===true){state='play';cdT=0;}else{state='count';cdT=3.6;}
}
let lastCd='';
function cdHud(){
  const el=$('#cd');
  if(cdT>0&&(state==='count'||state==='play')){
    const txt=cdT>0.6?String(Math.ceil(cdT-0.6)):'GO!';
    if(txt!==lastCd){lastCd=txt;el.textContent=txt;if(txt==='GO!')sfx.go();else sfx.beep();el.classList.remove('hidden','pop');void el.offsetWidth;el.classList.add('pop');}
  }else if(lastCd!==''){lastCd='';el.classList.add('hidden');}
}
function buildSwatches(box){
  box.innerHTML='';
  for(const c of PALETTE){
    const b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-label','Tank colour '+c);
    b.addEventListener('click',e=>{e.target.blur();sfx.click();playerColor=c;if(state==='start')reset();markSwatches();});
    box.appendChild(b);
  }
}
function markSwatches(){for(const b of document.querySelectorAll('.sw'))b.classList.toggle('sel',b.style.background===hexToRgb(playerColor));}
function hexToRgb(h){return `rgb(${parseInt(h.slice(1,3),16)}, ${parseInt(h.slice(3,5),16)}, ${parseInt(h.slice(5,7),16)})`;}
buildSwatches($('#sw1'));buildSwatches($('#sw2'));markSwatches();
function rematch(){startGame();}
$('#go').addEventListener('click',e=>{e.target.blur();audio();sfx.click();startGame();});
$('#again').addEventListener('click',e=>{e.target.blur();audio();sfx.click();rematch();});
for(const ev of ['pointerdown','keydown'])addEventListener(ev,audio,{passive:true});
function muteLabel(){const b=$('#mute');b.textContent=muted?'Sound off':'Sound on';b.classList.toggle('off',muted);}
$('#mute').addEventListener('click',e=>{e.target.blur();muted=!muted;try{localStorage.setItem('offramp-mute',muted?'1':'0');}catch(x){}muteLabel();audio();if(!muted)sfx.click();});
muteLabel();

// ---------- input ----------
const KEYMAP={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
function syncKeys(){
  input.kx=(keys.r?1:0)-(keys.l?1:0);
  input.ky=(keys.d?1:0)-(keys.u?1:0);
  input.fire=!!keys.space||fireTouch;
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(KEYMAP[k]){keys[KEYMAP[k]]=true;e.preventDefault();syncKeys();return;}
  if(k===' '||k==='Spacebar'){
    e.preventDefault();
    if(state==='start'){startGame();return;}
    keys.space=true;syncKeys();return;
  }
  if(k==='Enter'||k==='r'||k==='R'){
    if(state==='start')startGame();
    else if(state==='over'&&!$('#end').classList.contains('hidden')&&performance.now()-overShownAt>400)rematch();
  }
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(KEYMAP[k]){keys[KEYMAP[k]]=false;syncKeys();}
  else if(k===' '||k==='Spacebar'){keys.space=false;syncKeys();}
});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;syncKeys();});

const isMobile=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
if(isMobile)document.body.classList.add('touch');
// Mobile always plays landscape: if the phone is held upright, turn the whole game 90 degrees.
let rotated=false;
function fit(){
  const iw=window.innerWidth,ih=window.innerHeight,wrap=$('#wrap'),bd=document.body;
  rotated=bd.classList.contains('touch')&&ih>iw;
  bd.classList.toggle('rot',rotated);
  const ew=rotated?ih:iw,eh=rotated?iw:ih;
  bd.classList.toggle('land',ew>eh);bd.classList.toggle('compact',ew>eh&&eh<=600);
  if(rotated){wrap.style.width=ih+'px';wrap.style.height=iw+'px';wrap.style.transform='translateX('+iw+'px) rotate(90deg)';}
  else{wrap.style.width='';wrap.style.height='';wrap.style.transform='';}
  resize();
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');fit();}},{passive:true,once:true});
fit();
document.addEventListener('contextmenu',e=>e.preventDefault());

const stick=$('#stick'),knob=$('#knob');let stickId=null,fireTouch=false;
function stickMove(e){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width/2*0.9;
  let vx=e.clientX-cx,vy=e.clientY-cy;
  if(rotated){const t=vx;vx=vy;vy=-t;} // screen -> game axes when the layout is turned 90deg
  const m=Math.hypot(vx,vy);
  if(m>max){vx*=max/m;vy*=max/m;}
  knob.style.transform=`translate(${vx}px,${vy}px)`;
  const n=Math.min(m,max)/max;
  if(n<0.15){input.jx=input.jy=0;}
  else{const mag=Math.min(1,n/0.7),mm=Math.hypot(vx,vy)||1;input.jx=vx/mm*mag;input.jy=vy/mm*mag;}
}
function stickEnd(){stickId=null;input.jx=input.jy=0;knob.style.transform='translate(0,0)';}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickId)stickEnd();});
stick.addEventListener('pointercancel',e=>{if(e.pointerId===stickId)stickEnd();});
const fb=$('#fire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();fb.setPointerCapture(e.pointerId);fireTouch=true;fb.classList.add('on');syncKeys();});
const fireEnd=()=>{fireTouch=false;fb.classList.remove('on');syncKeys();};
fb.addEventListener('pointerup',fireEnd);fb.addEventListener('pointercancel',fireEnd);

// ---------- loop ----------
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=1/60){step(1/60);acc-=1/60;}
  hud();cdHud();render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__off={step,reset,startGame:()=>startGame(true),startCount:()=>startGame(),input,get tanks(){return tanks;},get state(){return state;},get rh(){return rh;},CX,CY,HX,HY,RL,W,H,STUBS,over,mdist,mouths};
})();
</script>
</body>
