<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Off Ramp</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#08080a;color:#f5c400;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}
  /* the canvas fills the screen (inside the side safe areas); HUD and controls float over the dead corners beside the ramps */
  #wrap{position:fixed;inset:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  #stage{position:relative;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none;
    font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 1px 3px #000}
  #hl{display:flex;flex-direction:column;gap:6px;max-width:170px}
  #pips{display:flex;gap:7px}
  .pip{width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.75);box-shadow:0 0 0 1.5px rgba(255,255,255,.35);transition:opacity .3s,transform .3s}
  .pip.me{box-shadow:0 0 0 2px #fff}
  .pip.dead{opacity:.28;filter:grayscale(1);transform:scale(.8)}
  button#mute{margin:0;padding:4px 9px;font-size:11px;letter-spacing:.06em;border-radius:6px;background:transparent;color:#f5c400;border:1px solid #f5c400;pointer-events:auto;flex:none}
  button#mute.off{color:#888;border-color:#555}
  #status{color:#fff}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(8,8,10,.84);text-align:center;padding:20px;z-index:5}
  .hidden{display:none!important}
  h1{margin:0;font-size:44px;letter-spacing:.14em;color:#f5c400;line-height:1}
  .bar{width:200px;height:10px;margin:4px 0 10px;
    background:repeating-linear-gradient(135deg,#f5c400 0 10px,#111 10px 20px)}
  .ov p{margin:0;font-size:17px;color:#e8e8e8;line-height:1.5}
  .ov small{margin-top:8px;color:#888;font-size:12px}
  button{font:inherit;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#111;background:#f5c400;border:0;
    border-radius:10px;padding:14px 34px;margin-top:14px;font-size:18px;cursor:pointer}
  button:active{transform:scale(.97)}
  #endTitle{font-size:34px;animation:endin .45s ease-out both}
  @keyframes endin{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){#endTitle{animation:none}}
  #endKick{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#aaa}
  #endSub{font-size:14px;color:#cfcfcf}
  #end.win{background:radial-gradient(circle at 50% 45%,rgba(245,196,0,.22),rgba(8,8,10,.9) 70%)}
  #end.win #endKick{color:#f5c400}
  #end.win #endTitle{color:#fff;text-shadow:0 0 22px rgba(245,196,0,.8),0 3px 0 #000}
  #end.lose{background:radial-gradient(circle at 50% 45%,rgba(229,72,77,.22),rgba(8,8,10,.92) 70%)}
  #end.lose #endKick{color:#ff6b70}
  #end.lose #endTitle{color:#ff5a5f;text-shadow:0 3px 0 #000}
  #end.lose .bar{background:repeating-linear-gradient(135deg,#e5484d 0 10px,#111 10px 20px)}
  .lbl{margin-top:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#888}
  .sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:360px}
  button.sw{width:36px;height:52px;padding:3px;margin:0;border-radius:10px;border:2px solid #2a2a2e;background:#17171a;box-shadow:0 0 0 0 transparent;transition:box-shadow .1s,border-color .1s}
  button.sw canvas{position:static;inset:auto;display:block;width:100%;height:100%}
  button.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,255,255,.35);background:#232327}
  #cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;
    font-size:130px;font-weight:900;letter-spacing:.04em;color:#f5c400;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.7)}
  #cd.n{animation:tick 1s ease-in both}
  #cd.n::after,#cd.go::after{content:'';position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border:4px solid #f5c400;border-radius:50%;animation:ringout 1s ease-out both}
  #cd.go{color:#fff;animation:goburst .6s ease-out both;text-shadow:0 0 22px #f5c400,0 0 56px #f5c400,0 4px 0 #000}
  #cd.go::after{animation-duration:.6s;width:140px;height:140px;margin:-70px 0 0 -70px}
  @keyframes tick{0%{transform:scale(1.7);opacity:0}15%{transform:scale(1);opacity:1}70%{transform:scale(.94);opacity:1}100%{transform:scale(.7);opacity:0}}
  @keyframes goburst{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.3);opacity:1}100%{transform:scale(2);opacity:0}}
  @keyframes ringout{from{transform:scale(.4);opacity:.9}to{transform:scale(3);opacity:0}}
  @media (prefers-reduced-motion:reduce){#cd.n,#cd.go,#cd.n::after,#cd.go::after{animation:none}#cd.n::after,#cd.go::after{display:none}}
  #ctl{display:none}
  body.touch #ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
  body.touch #ctl>*{pointer-events:auto}
  #stick{position:relative;width:112px;height:112px;border-radius:50%;background:rgba(245,196,0,.10);border:2px solid rgba(245,196,0,.5);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#f5c400;opacity:.9;pointer-events:none}
  #fire{width:92px;height:92px;border-radius:50%;margin:0;padding:0;font-size:16px;background:#e5484d;color:#fff;border:3px solid #ffd0d0;touch-action:none}
  #fire.on{background:#ff7b7f}
  #rot{display:none}
  @media (orientation:portrait){body.touch #rot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:#08080a;font-size:20px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}}
  #rot i{width:38px;height:64px;border:3px solid #f5c400;border-radius:7px;animation:tilt 1.6s ease-in-out infinite alternate}
  @keyframes tilt{to{transform:rotate(90deg)}}
  @media (prefers-reduced-motion:reduce){#rot i{animation:none;transform:rotate(90deg)}}
  @media (max-height:600px){
    .ov{gap:5px;padding:10px}
    h1{font-size:30px}
    .bar{height:8px;margin:2px 0 4px}
    .ov p{font-size:14px;line-height:1.35}
    .ov small{display:none}
    .lbl{margin-top:4px}
    button{padding:9px 28px;margin-top:6px;font-size:16px}
    button.sw{padding:0;margin:0}
    button#mute{padding:4px 9px;margin:0;font-size:11px}
    #endTitle{font-size:26px}
    #cd{font-size:90px}
    #end .bar{margin:0}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><div id="hl"><div id="pips" role="img" aria-label="Tanks on pad: 4"></div><span id="status">Push them off</span></div><button id="mute" type="button">Sound on</button></div>
    <div id="ctl">
      <div id="stick"><div id="knob"></div></div>
      <button id="fire">Fire</button>
    </div>
    <div id="start" class="ov">
      <h1>OFF RAMP</h1>
      <div class="bar"></div>
      <p>Bump to shove.</p>
      <p>Shells hit harder.</p>
      <p>The bottom of the ramp is out.</p>
      <div class="lbl">Your tank</div>
      <div class="sws" id="sw1"></div>
      <button id="go">Start</button>
      <small>Stick + Fire &nbsp;·&nbsp; WASD / arrows + Space</small>
    </div>
    <div id="cd" class="hidden"></div>
    <div id="end" class="ov hidden">
      <div id="endKick">Eliminated</div>
      <h1 id="endTitle">Down the ramp</h1>
      <div class="bar"></div>
      <p id="endSub"></p>
      <div class="lbl">Your tank</div>
      <div class="sws" id="sw2"></div>
      <button id="again">Rematch</button>
    </div>
  </div>
</div>
<div id="rot"><i></i>Rotate your phone</div>
<script>
(()=>{
'use strict';
// ---------- world: wide pad, open ramp on all four sides ----------
const HX=210,HY=120,RL=80,R=14,W=2*(HX+RL),H=2*(HY+RL),CX=W/2,CY=H/2; // pad half-extents, ramp length
const LV=[60,105,HX]; // ramp half-widths: level 1 (4 tanks), level 2 (3 tanks), full (last two); capped per side
const STUB_L=20,STUB_T=8; // one-tank-wide stop wall at the middle of each lip
const SPEED_P=135,SPEED_AI=100,KD=4,SLIDE=270;
const SHELL_V=340,SHELL_KNOCK=340,BUMP_CAP=105,BUMP_ACC=700,KV_MAX=480;
const FIRE_CD_P=0.55;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const over=t=>Math.max(Math.abs(t.x-CX)-HX,Math.abs(t.y-CY)-HY); // how far past the nearest pad edge (<0 inside)
const onRamp=t=>over(t)>0;
const laneX=()=>Math.min(rh,HY),laneY=()=>Math.min(rh,HX); // half-widths of the left/right and top/bottom ramps
function mouths(){ // centre of the open lane either side of each stop wall
  const lx=STUB_L+(laneX()-STUB_L)/2,ly=STUB_L+(laneY()-STUB_L)/2,out=[];
  for(const s of [-1,1])for(const sg of [-1,1])out.push({x:CX+s*HX,y:CY+lx*sg},{x:CX+ly*sg,y:CY+s*HY});
  return out;
}
function nearestMouth(t){let b=null,bd=1e9;for(const m of mouths()){const d=Math.hypot(t.x-m.x,t.y-m.y);if(d<bd){bd=d;b=m;}}return [b,bd];}
function mdist(t){return onRamp(t)?-over(t):nearestMouth(t)[1];}   // small = close to falling off
function mouthDir(t){
  if(onRamp(t))return outDir(t);
  const [m]=nearestMouth(t),dx=m.x-t.x,dy=m.y-t.y,l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];
}
function outDir(t){const dx=t.x-CX,dy=t.y-CY;return Math.abs(dx)-HX>=Math.abs(dy)-HY?[Math.sign(dx)||1,0]:[0,Math.sign(dy)||1];}
// stop walls (axis-aligned rects)
const STUBS=[];
for(const [ux,uy] of [[1,0],[-1,0],[0,1],[0,-1]]){
  if(ux!==0){const x0=CX+(ux>0?HX:-HX-STUB_T);STUBS.push({ux,uy,x0,x1:x0+STUB_T,y0:CY-STUB_L,y1:CY+STUB_L});}
  else{const y0=CY+(uy>0?HY:-HY-STUB_T);STUBS.push({ux,uy,x0:CX-STUB_L,x1:CX+STUB_L,y0,y1:y0+STUB_T});}
}

// ---------- state ----------
let state='start'; // start | play | over
const PALETTE=['#ffd21f','#ef4444','#3b82f6','#a855f7','#22c55e','#f97316','#ec4899','#06b6d4'];
const darker=c=>'#'+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*0.55).toString(16).padStart(2,'0')).join('');
let playerColor=PALETTE[0],cdT=0,flashT=0,rampFlash=0,bumpT=-1;
// ---------- sound (synthesised, no files) ----------
let AC=null,master=null,noiseBuf=null,muted=false,hum=null;
try{muted=localStorage.getItem('offramp-mute')==='1';}catch(e){}
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);startHum();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}
function noise(dur,vol,freq,kind,delay){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t0=AC.currentTime+(delay||0),src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;f.type=kind||'lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t0,Math.random()*0.5);src.stop(t0+dur+0.02);
}
function startHum(){ // quiet engine bed: two low oscillators through a low-pass; gain/pitch follow tank speed (humUpdate)
  const g=AC.createGain(),f=AC.createBiquadFilter(),o1=AC.createOscillator(),o2=AC.createOscillator();
  g.gain.value=0;f.type='lowpass';f.frequency.value=240;o1.type='sawtooth';o2.type='square';o1.frequency.value=46;o2.frequency.value=23;
  o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();hum={g,o1,o2};
}
function humUpdate(){
  if(!hum||!AC)return;
  let tg=0,fr=46;
  if(!muted&&state==='play'&&!upright()){
    const P=tanks[0];let a=0,n=0;
    for(const t of tanks)if(t.alive&&!t.isPlayer){a+=t.sp/SPEED_AI;n++;}
    a=n?a/n:0;const pf=P.alive?P.sp/SPEED_P:0;
    tg=0.016+0.03*pf+0.012*a;fr=44+34*pf+16*a;
  }
  const now=AC.currentTime;hum.g.gain.setTargetAtTime(tg,now,0.12);hum.o1.frequency.setTargetAtTime(fr,now,0.15);hum.o2.frequency.setTargetAtTime(fr/2,now,0.15);
}
document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden)AC.suspend();else AC.resume();}});
const rv=a=>1+(Math.random()-0.5)*a; // small random pitch variation
const sfx={
  fire(me){const v=me?1:0.55,r=rv(.2);noise(0.12,0.28*v,1800*r,'bandpass');tone(240*r,60*r,0.13,'sawtooth',0.18*v);},
  hit(){const r=rv(.2);tone(170*r,40,0.2,'square',0.3);tone(70*r,34,0.26,'sine',0.26);noise(0.14,0.32,900*r,'lowpass');if(Math.random()<0.5)tone(1300*r,700,0.05,'square',0.05);}, // heavier than a bump
  bump(v){const r=rv(.3);tone(95*r,45*r,0.09,'triangle',0.16+0.14*v);if(v>0.5)noise(0.05,0.12,700,'lowpass');},
  clank(){const r=rv(.3);tone(520*r,300*r,0.07,'square',0.07);noise(0.04,0.1,2500,'bandpass');},
  ping(){tone(900*rv(.3),500,0.04,'square',0.05);},
  fall(){tone(760,90,0.75,'sawtooth',0.16);noise(0.35,0.2,420,'lowpass',0.55);},
  beep(n){const f=[0,659,554,466][n]||440;tone(f,f,0.07,'square',0.16);noise(0.03,0.14,3500,'highpass');}, // a tick per number, higher as it nears GO
  go(){tone(880,880,0.4,'square',0.18);tone(1320,1320,0.4,'triangle',0.1);},
  widen(n){const b=n===1?360:540;for(let i=0;i<3;i++)tone(b*(1+i*.25),b*(1+i*.25),0.09,'square',0.12,i*0.11);tone(b*0.5,b*1.6,0.45,'triangle',0.16,0.05);}, // stage 1 lower, stage 2 higher
  click(){tone(620,620,0.05,'square',0.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.16,'square',0.14,i*0.11));tone(1047,1047,0.5,'triangle',0.12,0.46);},
  lose(){[392,330,262].forEach((f,i)=>tone(f,f*0.97,0.22,'sawtooth',0.14,i*0.2));tone(130,50,0.8,'sawtooth',0.14,0.6);}
};
const MAXP=200; // particle cap: oldest dropped first
function addP(p){if(parts.length>=MAXP)parts.shift();parts.push(p);}
function ring(x,y,r0,r1,c,life){addP({k:'ring',x,y,vx:0,vy:0,life,max:life,c,r0,r1});}
function puff(x,y,sz,gr,al,life,dust,vx,vy){addP({k:'smoke',x,y,vx,vy,life,max:life,sz,gr,al,dust,drag:2.5});}
function glow(x,y,sz,life){addP({k:'glow',x,y,vx:0,vy:0,life,max:life,sz});}
let rh=LV[0],rhT=LV[0],widenMsg=0,shoved=0,aiShoved=0,endT=0; // shoved: AIs the player pushed off; aiShoved: AIs pushed off by other AIs
let tanks=[],shells=[],parts=[],time=0,shake=0,overAt=0,overShownAt=0,playerWon=false;
const input={kx:0,ky:0,jx:0,jy:0,fire:false};
const keys={};
const marks=document.createElement('canvas');marks.width=W;marks.height=H;
const mctx=marks.getContext('2d');mctx.lineWidth=4.5;mctx.strokeStyle='rgba(0,0,0,.5)';let fadeN=0; // fading tread marks

function mk(i,x,y,color,dark,isP){
  return {id:i,x,y,face:Math.atan2(CY-y,CX-x),dx:0,dy:0,kx:0,ky:0,stun:0,cd:0.5+Math.random()*0.7,flash:0,hf:Math.atan2(CY-y,CX-x),rec:0,trk:0,sp:0,lm:null,
    alive:true,fallT:0,fx:0,fy:1,color,dark,isPlayer:isP,lowT:0,tgt:null,rt:Math.random()*0.3,wob:Math.random()*6.28};
}
function reset(){
  const J=()=>(Math.random()-0.5)*20,D=70; // everyone starts D in from their own edge
  const ai=PALETTE.filter(c=>c!==playerColor);
  tanks=[
    mk(0,CX,CY+HY-D,playerColor,darker(playerColor),true),
    mk(1,CX-HX+D+J(),CY+J(),ai[0],darker(ai[0]),false),
    mk(2,CX+HX-D+J(),CY+J(),ai[1],darker(ai[1]),false),
    mk(3,CX+J(),CY-HY+D+J()/2,ai[2],darker(ai[2]),false)
  ];
  shells=[];parts=[];mctx.clearRect(0,0,W,H);shoved=aiShoved=0;time=0;shake=0;playerWon=false;rh=rhT=LV[0];widenMsg=0;flashT=0;rampFlash=0;
}
reset();

// ---------- AI ----------
function think(t,dt){
  t.rt-=dt;t.pan=false; // pan: climbing in panic (only ever true on a ramp)
  if(t.rt<=0||!t.tgt||!t.tgt.alive){
    t.rt=0.3+Math.random()*0.2;
    let best=null;
    for(const o of tanks) if(o!==t&&o.alive&&(!best||mdist(o)<mdist(best))) best=o; // closest to a ramp
    t.tgt=best;
  }
  const g=t.tgt;
  if(!onRamp(t))t.pside=0;
  if(onRamp(t)){
    // Actually on a ramp: panic and climb. Exception: a shallow overshoot while still
    // shoving someone who is further down the slope (easy to climb out of there).
    const depth=over(t)/RL;
    if(!(g&&g.alive&&mdist(g)<mdist(t)-4&&depth<0.3)){
      const o=outDir(t),v=[-o[1],o[0]],lat=(t.x-CX)*v[0]+(t.y-CY)*v[1],lane=o[0]?laneX():laneY();
      if(!t.pside)t.pside=lat>=0?1:-1; // stay on one side of the stop wall while climbing
      const st=clamp((t.pside*(STUB_L+(lane-STUB_L)/2)-lat)/24,-.6,.6); // aim for the open gap beside it
      t.dx=-o[0]+v[0]*st;t.dy=-o[1]+v[1]*st;t.pan=true;
      return;
    }
  }
  if(!g){t.dx=t.dy=0;return;}
  // frame: u = the target's outward (toward-its-ramp) direction, v = lateral
  const u=mouthDir(g),v=[-u[1],u[0]];
  const ga=(g.x-CX)*u[0]+(g.y-CY)*u[1],gl=(g.x-CX)*v[0]+(g.y-CY)*v[1];
  const ma=(t.x-CX)*u[0]+(t.y-CY)*u[1],ml=(t.x-CX)*v[0]+(t.y-CY)*v[1];
  const ex=gl-ml,ey=ga-ma;
  let ax,lat;
  if(ey>12){
    // target is further out than me: line up laterally while moving toward its ramp, drive into it
    t.lowT=0;
    lat=clamp(ex/16,-1,1);ax=Math.abs(ex)<32?1:0.45;
    t.dx=u[0]*ax+v[0]*lat;t.dy=u[1]*ax+v[1]*lat;
  }else{
    // I'm the low tank. Don't run for the walls: face the threat, meet it, shoot it, dodge.
    t.lowT=(t.lowT||0)+dt;
    if(t.lowT<4){
      const ph=((time*0.9+t.wob)%1+1)%1;
      if(ph<0.3&&Math.abs(ex)<70){lat=clamp(ex/16,-1,1)*0.5;ax=-0.6;}
      else{
        if(!t.sd||time>t.sdT){t.sd=Math.random()<0.5?-1:1;t.sdT=time+0.7+Math.random()*0.8;}
        let sd=t.sd;
        if(over({x:t.x+v[0]*sd*30,y:t.y+v[1]*sd*30})>-R-24)sd=-sd;
        lat=sd;ax=0;
      }

      if(mdist(t)<70){const dx=CX-t.x,dy=CY-t.y,m=Math.hypot(dx,dy)||1;t.dx=dx/m*0.8;t.dy=dy/m*0.8;} // stay off the lip
    }else{
      // flank: slip round to the inner side of the target, then shove outward
      const lane=ex>0?-1:1,a=ga-30,l=gl+lane*60;
      const tx=clamp(CX+u[0]*a+v[0]*l,CX-HX+R+10,CX+HX-R-10),ty=clamp(CY+u[1]*a+v[1]*l,CY-HY+R+10,CY+HY-R-10);

function aiShoot(t){
  if(t.cd>0||onRamp(t))return;
  for(const o of tanks){
    if(o===t||!o.alive)continue;
    const vx=o.x-t.x,vy=o.y-t.y,d=Math.hypot(vx,vy);
    if(d<40||d>300)continue;
    if(Math.abs(angDiff(Math.atan2(vy,vx),t.face))<0.28){fire(t);t.cd=0.8+Math.random()*0.6;return;}
  }
}

// ---------- actions ----------
function fire(t){
  t.cd=t.isPlayer?FIRE_CD_P:t.cd;
  const ca=Math.cos(t.face),sa=Math.sin(t.face);
  shells.push({x:t.x+ca*(R+5),y:t.y+sa*(R+5),vx:ca*SHELL_V,vy:sa*SHELL_V,owner:t,life:1.3});
  t.kx-=ca*35;t.ky-=sa*35;
  const tip=tankReady?MUZZLE:R+9,mx=t.x+ca*tip,my=t.y+sa*tip; // flash at the barrel tip; the shell itself spawns at R+5 (above)
  glow(mx,my,34,.08);spark(mx,my,5,'#ffe9a0',200);ring(mx,my,3,14,'#fff2a8',0.15);t.rec=1;
  for(let i=0;i<3;i++)puff(mx+ca*4,my+sa*4,10,1.6,.45,.5+Math.random()*.3,false,ca*50+(Math.random()-.5)*30,sa*50+(Math.random()-.5)*30);
  sfx.fire(t.isPlayer);
}
function spark(x,y,n,c,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(0.3+Math.random());
    const l=0.18+Math.random()*0.22;addP({k:'streak',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,c,drag:5});}
}
function kill(t){
  const o=outDir(t);t.fx=o[0];t.fy=o[1];
  if(!t.isPlayer&&t.by&&time-t.by.t<2.5){if(t.by.o.isPlayer)shoved++;else aiShoved++;}
  t.alive=false;t.fallT=0;t.dx=t.dy=0;
  shake=Math.max(shake,5);
  spark(t.x,t.y,14,'#ffffff',140);
  for(let i=0;i<9;i++)puff(t.x+(Math.random()-0.5)*14,t.y+(Math.random()-0.5)*14,22+Math.random()*16,1.3,.7,.7+Math.random()*.5,true,o[0]*30+(Math.random()-0.5)*50,o[1]*30+(Math.random()-0.5)*50); // dust cloud
  ring(t.x,t.y,8,70,'#ffffff',0.5);ring(t.x,t.y,4,40,t.color,0.4);
  flashT=Math.max(flashT,t.isPlayer?0.6:0.35);

function limitKv(t,m){const k=Math.hypot(t.kx,t.ky);if(k>m){t.kx*=m/k;t.ky*=m/k;}}
function insideShellBlocked(x,y){
  const ax=Math.abs(x-CX),ay=Math.abs(y-CY);
  if(ax>HX+RL+8||ay>HY+RL+8)return true;
  if((ax>HX&&ay>laneX())||(ay>HY&&ax>laneY()))return true; // edge walls / ramp side walls
  for(const r of STUBS)if(x>r.x0&&x<r.x1&&y>r.y0&&y<r.y1)return true;
  return false;
}

// ---------- simulation ----------
function step(dt){
  if(state==='start')return;
  if(state==='count'){cdT-=dt;if(cdT<=0.6){state='play';clearInput();}return;} // frozen until GO; nothing held before GO counts after it
  if(cdT>0)cdT-=dt;
  time+=dt;
  const P=tanks[0];
  for(const t of tanks){
    if(!t.alive)continue;
    if(t.isPlayer){
      if(state==='play'){
        let ix=clamp(input.kx+input.jx,-1,1),iy=clamp(input.ky+input.jy,-1,1);
        const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
        t.dx=ix;t.dy=iy;
        if(input.fire&&t.cd<=0)fire(t);
      }else{t.dx=t.dy=0;}
    }else if(time<1.0){t.dx=t.dy=0; // brief standoff before the AIs engage
    }else{
      think(t,dt);
      const m=Math.hypot(t.dx,t.dy);if(m>1){t.dx/=m;t.dy/=m;}
      aiShoot(t);
    }
    // move
    const sp=t.isPlayer?SPEED_P:SPEED_AI,k=t.stun>0?0.35:1;
    let vx=t.dx*sp*k+t.kx,vy=t.dy*sp*k+t.ky;
    if(onRamp(t)){ // downhill pull, outward along the ramp axis
      const o=outDir(t),pull=SLIDE*Math.min(1,over(t)/RL);
      vx+=o[0]*pull;vy+=o[1]*pull;
    }
    t.x+=vx*dt;t.y+=vy*dt;
    const f=Math.exp(-KD*dt);t.kx*=f;t.ky*=f;
    t.stun-=dt;t.cd-=dt;t.flash-=dt;
    const dm=Math.hypot(t.dx,t.dy);
    t.dustT=(t.dustT||0)-dt;
    if(dm>0.3&&t.dustT<=0){t.dustT=0.07;puff(t.x-Math.cos(t.face)*14+(Math.random()-0.5)*6,t.y-Math.sin(t.face)*14+(Math.random()-0.5)*6,8,1.4,.35,.4,true,(Math.random()-0.5)*14,(Math.random()-0.5)*14);}
    if(dm>0.2)t.face+=angDiff(Math.atan2(t.dy,t.dx),t.face)*Math.min(1,16*dt);
    t.hf+=angDiff(t.face,t.hf)*Math.min(1,7*dt);                 // hull turns slower than the turret
    t.sp=dm*sp*k;t.trk+=t.sp*dt;t.rec=Math.max(0,t.rec-dt*7);
  }
  // tank vs tank: the tank nearer the centre shoves the outer one toward its ramp (asymmetric on purpose)
  for(let it=0;it<2;it++){
    for(let i=0;i<tanks.length;i++)for(let j=i+1;j<tanks.length;j++){
      const a=tanks[i],b=tanks[j];
      if(!a.alive||!b.alive)continue;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const min=R*2;
      if(d>=min)continue;
      if(d<0.001){dx=0.01;dy=0.01;d=0.014;}
      const ra=mdist(a),rb=mdist(b);
      let upA;
      if(Math.abs(ra-rb)>=6)upA=ra>rb;
      else{ // roughly level: whoever is driving harder into the other is the pusher
        const pa=(a.dx*dx+a.dy*dy)/d,pb=-(b.dx*dx+b.dy*dy)/d;
        upA=Math.abs(pa-pb)>0.05?pa>pb:(ra>rb||(ra===rb&&a.id<b.id));
      }
      const up=upA?a:b,dn=upA?b:a;if(it===0)dn.by={o:up,t:time};
      const nx=(dn.x-up.x)/d,ny=(dn.y-up.y)/d;
      const pen=min-Math.hypot(dn.x-up.x,dn.y-up.y);
      dn.x+=nx*pen*0.8;dn.y+=ny*pen*0.8;
      up.x-=nx*pen*0.2;up.y-=ny*pen*0.2;
      if(it===0){
        if(time-bumpT>0.14){bumpT=time;sfx.bump(Math.min(1,Math.hypot(a.sp,b.sp)/160));spark((a.x+b.x)/2,(a.y+b.y)/2,5,'#e8e8e8',90);}
        // shove direction: away from pusher, biased hard toward the loser's nearest ramp
        const o=mouthDir(dn);
        let sx=nx*0.7+o[0]*0.75,sy=ny*0.7+o[1]*0.75;const sm=Math.hypot(sx,sy)||1;sx/=sm;sy/=sm;
        const along=dn.kx*sx+dn.ky*sy;
        if(along<BUMP_CAP){const a2=Math.min(BUMP_ACC*dt,BUMP_CAP-along);dn.kx+=sx*a2;dn.ky+=sy*a2;}
        limitKv(dn,KV_MAX);
      }
    }
  }
  // walls: corridor sides / pad corners, stop walls; out when the end of any ramp is touched
  const Mx=HX-R,My=HY-R,Lx=laneX()-R,Ly=laneY()-R;
  for(const t of tanks){
    if(!t.alive)continue;
    let ax=t.x-CX,ay=t.y-CY;
    if(Math.abs(ax)>Mx&&Math.abs(ay)>Lx){ // past the pad edge on x, but outside the left/right ramp lane
      if(Math.abs(ax)-Mx<Math.abs(ay)-Lx){t.x=CX+Math.sign(ax)*Mx;if(t.kx*ax>0)t.kx*=-0.3;}
      else{t.y=CY+Math.sign(ay)*Lx;if(t.ky*ay>0)t.ky*=-0.3;}
    }
    ax=t.x-CX;ay=t.y-CY;
    if(Math.abs(ay)>My&&Math.abs(ax)>Ly){ // past the pad edge on y, but outside the top/bottom ramp lane
      if(Math.abs(ay)-My<Math.abs(ax)-Ly){t.y=CY+Math.sign(ay)*My;if(t.ky*ay>0)t.ky*=-0.3;}
      else{t.x=CX+Math.sign(ax)*Ly;if(t.kx*ax>0)t.kx*=-0.3;}
    }
    let hs=false;
    for(const r of STUBS){
      const cx=clamp(t.x,r.x0,r.x1),cy=clamp(t.y,r.y0,r.y1);
      let dx=t.x-cx,dy=t.y-cy;const d=Math.hypot(dx,dy);
      if(d<R){
        hs=true;if(!t.onStub&&t.sp>40)sfx.clank();
        if(d<0.001){dx=t.x<(r.x0+r.x1)/2?-1:1;dy=0;}else{dx/=d;dy/=d;}
        t.x=cx+dx*R;t.y=cy+dy*R;
        const vn=t.kx*dx+t.ky*dy;if(vn<0){t.kx-=vn*1.3*dx;t.ky-=vn*1.3*dy;}
        if(dx*r.ux+dy*r.uy>0.7){ // touching the outer (ramp) face: slide round the end of the wall
          const lat=(t.x-CX)*-r.uy+(t.y-CY)*r.ux,sd=lat>0.5?1:lat<-0.5?-1:(t.id&1?1:-1);
          t.x+=-r.uy*sd*90*dt;t.y+=r.ux*sd*90*dt;
        }
      }
    }
    t.onStub=hs;
    if(Math.abs(t.x-CX)+R>=HX+RL||Math.abs(t.y-CY)+R>=HY+RL)kill(t); // touching the bottom of a ramp is out
  }
  // shells
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(((s.age=(s.age||0)+1)&1)===0)addP({x:s.x,y:s.y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,life:0.22,max:0.22,c:'#ffd88a',sz:3}); // embers
    let dead=s.life<=0||insideShellBlocked(s.x,s.y);
    if(dead&&s.life>0){sfx.ping();spark(s.x,s.y,5,'#d8d8d8',110);puff(s.x,s.y,10,1.4,.4,.4,true,0,0);}
    if(!dead)for(const t of tanks){
      if(!t.alive||t===s.owner)continue;
      if(Math.hypot(t.x-s.x,t.y-s.y)<R+3){
        const m=Math.hypot(s.vx,s.vy);
        t.kx+=s.vx/m*SHELL_KNOCK;t.ky+=s.vy/m*SHELL_KNOCK;limitKv(t,KV_MAX);
        t.by={o:s.owner,t:time};t.stun=0.3;t.flash=0.12;shake=Math.max(shake,2.5);
        spark(s.x,s.y,12,'#ffd27a',210);glow(s.x,s.y,46,.12);ring(s.x,s.y,4,34,'#ffd27a',0.3);ring(s.x,s.y,2,18,'#ffffff',0.2);puff(s.x,s.y,14,1.5,.5,.5,false,s.vx*.08,s.vy*.08);sfx.hit();dead=true;break;
      }
    }
    if(dead)shells.splice(i,1);
  }
  // falling tanks, particles
  for(const t of tanks)if(!t.alive){
    t.fallT+=dt;t.x+=t.fx*140*dt;t.y+=t.fy*140*dt;
    if(t.fallT<0.8&&((t.fd=(t.fd||0)-dt)<=0)){t.fd=.06;puff(t.x,t.y,14,1.5,.4,.5,true,(Math.random()-0.5)*30,(Math.random()-0.5)*30);} // trailing dust while it tumbles
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.drag){const f=Math.max(0,1-p.drag*dt);p.vx*=f;p.vy*=f;}if(p.life<=0)parts.splice(i,1);}
  shake=Math.max(0,shake-dt*14);
  // ramps grow as tanks fall: level 1 with 4 tanks, level 2 with 3, full width for the last two
  {
    const n=tanks.filter(t=>t.alive).length,lvl=n>=4?0:n===3?1:2;
    if(LV[lvl]>rhT){rhT=LV[lvl];widenMsg=2;rampFlash=1;sfx.widen(lvl);}
    if(rh<rhT)rh=Math.min(rhT,rh+Math.max(30,(rhT-rh)*4)*dt); // eased: fast start, soft landing
    if(widenMsg>0)widenMsg-=dt;
    if(rampFlash>0)rampFlash-=dt*1.4;
    if(flashT>0)flashT-=dt*2.5;
  }
  // result
  if(state==='play'){
    const alive=tanks.filter(t=>t.alive).length;
    if(!P.alive){state='over';clearInput();endT=time;playerWon=false;overAt=time+0.9;sfx.lose();}
    else if(alive===1){
      state='over';clearInput();endT=time;playerWon=true;overAt=time+0.6;sfx.win();
      for(let i=0;i<46;i++){const a=Math.random()*6.283,sp=60+Math.random()*180;
        addP({x:P.x,y:P.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.9+Math.random()*0.6,max:1.5,c:PALETTE[i%PALETTE.length],sz:5});}
    }
  }
  if(state==='over'&&!$('#end').classList.contains('hidden')===false&&time>=overAt){
    const e=$('#end'),m=Math.floor(endT/60),sec=String(Math.floor(endT%60)).padStart(2,'0');
    e.classList.toggle('win',playerWon);e.classList.toggle('lose',!playerWon);
    $('#endKick').textContent=playerWon?'Victory':'Eliminated';
    $('#endTitle').textContent=playerWon?'Pad is yours':'Down the ramp';
    $('#endSub').textContent='Lasted '+m+':'+sec+' \u00b7 You shoved '+shoved+(shoved===1?' tank':' tanks')+' off';
    $('#end').classList.remove('hidden');overShownAt=performance.now();
  }
}

    }
    ctx.fillStyle=G[0];ctx.fillRect(-rh,HALF,2*rh,RL);
    ctx.fillStyle='rgba(200,20,20,.16)';ctx.fillRect(-rh,HALF+NR,2*rh,RL-NR); // beyond the point of no return
    for(let i=1;i<8;i++){ // depth lines: shadow + highlight ridge
      const y=HALF+RL*i/8;ctx.fillStyle='rgba(0,0,0,'+(0.25+i*0.04)+')';ctx.fillRect(-rh,y,2*rh,1.5);
      ctx.fillStyle='rgba(255,255,255,'+(0.16-i*0.015)+')';ctx.fillRect(-rh,y+1.5,2*rh,1);
    }
    if(rampFlash>0){ctx.fillStyle='rgba(255,230,120,'+(Math.min(1,rampFlash)*0.5)+')';ctx.fillRect(-rh,HALF,2*rh,RL);}
    // point of no return
    ctx.setLineDash([7,5]);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.moveTo(-rh,HALF+NR+1.5);ctx.lineTo(rh,HALF+NR+1.5);ctx.stroke();
    ctx.strokeStyle='#ff3b30';ctx.beginPath();ctx.moveTo(-rh,HALF+NR);ctx.lineTo(rh,HALF+NR);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ff3b30';
    for(const x of [-rh*0.5,0,rh*0.5]){ctx.beginPath();ctx.moveTo(x-4,HALF+NR+5);ctx.lineTo(x+4,HALF+NR+5);ctx.lineTo(x,HALF+NR+11);ctx.closePath();ctx.fill();}
    // drop-off: the surface ends in a lip, then black void
    ctx.fillStyle=G[1];ctx.fillRect(-rh,END-36,2*rh,22);
    ctx.fillStyle='#000';ctx.fillRect(-rh,END-14,2*rh,15);
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(-rh,END-14.5,2*rh,1.5);
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-rh,HALF-1.5,2*rh,3);
    // side rails (outside the lane) with hazard chevrons, plus warning lights
    for(const sg of [-1,1]){
      const a=sg<0?-rh-8:rh;
      ctx.fillStyle='#17181c';ctx.fillRect(a,HALF-3,8,RL+3);
      ctx.save();ctx.beginPath();ctx.rect(a,HALF-3,8,RL+3);ctx.clip();
      ctx.fillStyle='#f5c400';
      for(let y0=HALF-6;y0<END;y0+=12){ctx.beginPath();ctx.moveTo(a,y0);ctx.lineTo(a+4,y0+4.5);ctx.lineTo(a+8,y0);ctx.lineTo(a+8,y0+5);ctx.lineTo(a+4,y0+9.5);ctx.lineTo(a,y0+5);ctx.closePath();ctx.fill();}
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(sg<0?a:a+7,HALF-3,1,RL+3);          // bevel on the lane side
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(sg<0?a+8:a-3,HALF,3,RL);                    // rail shadow on the slope
      for(let i=0;i<3;i++){ // warning lights; chase while the ramp is widening
        const on=widening?((tnow*9|0)%3)===i:false,ly=HALF+6+i*(RL-14)/2,lx=a+4;
        ctx.fillStyle=on?'rgba(255,170,0,.35)':'rgba(0,0,0,0)';if(on){ctx.beginPath();ctx.arc(lx,ly,8,0,6.283);ctx.fill();}
        ctx.fillStyle=on?'#ffd24a':'#6b4a00';ctx.beginPath();ctx.arc(lx,ly,3,0,6.283);ctx.fill();
        ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
      }
    }
    ctx.restore();
  }
  for(const r of STUBS){ // stop walls: concrete barrier, hazard paint, bevel, bolts
    const w=r.x1-r.x0,h=r.y1-r.y0;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(r.x0+r.ux*2+2,r.y0+r.uy*2+3,w,h);
    ctx.fillStyle='#8f949e';ctx.fillRect(r.x0,r.y0,w,h);
    ctx.save();ctx.beginPath();ctx.rect(r.x0+1.5,r.y0+1.5,w-3,h-3);ctx.clip();
    ctx.fillStyle='#f5c400';ctx.fillRect(r.x0,r.y0,w,h);ctx.fillStyle='#15161a';
    for(let d=-h;d<w;d+=9){ctx.beginPath();ctx.moveTo(r.x0+d,r.y1);ctx.lineTo(r.x0+d+4.5,r.y1);ctx.lineTo(r.x0+d+4.5+h,r.y0);ctx.lineTo(r.x0+d+h,r.y0);ctx.closePath();ctx.fill();}
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(r.x0,r.y0,w,1.5);ctx.fillRect(r.x0,r.y0,1.5,h);   // lit top/left bevel
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(r.x0,r.y1-1.5,w,1.5);ctx.fillRect(r.x1-1.5,r.y0,1.5,h); // shaded bottom/right bevel
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(r.x0,r.y0,w,h);
    ctx.fillStyle='#2a2c31';
    for(const e of [-1,1]){const bx=r.x0+w/2+(w>h?e*(w/2-4):0),by=r.y0+h/2+(w>h?0:e*(h/2-4));ctx.beginPath();ctx.arc(bx,by,1.6,0,6.283);ctx.fill();}
  }
}

// ---------- render ----------
const canvas=$('#c'),ctx=canvas.getContext('2d');
let sc=1,ox=0,oy=0;
function resize(){
  const st=$('#stage'),dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=Math.max(1,Math.round(st.clientWidth*dpr)),ch=Math.max(1,Math.round(st.clientHeight*dpr));
  canvas.width=cw;canvas.height=ch;
  sc=Math.min(cw/W,ch/H);ox=(cw-W*sc)/2;oy=(ch-H*sc)/2;
}
new ResizeObserver(resize).observe($('#stage'));addEventListener('resize',resize);resize();

function rr(x,y,w,h,r){rrg(ctx,x,y,w,h,r);}
function drawTank(t){
  if(!tankReady){drawTankVec(t);return;}
  const img=tints[t.color]||(tints[t.color]=tintTank(t.color));
  if(t.alive){ctx.globalAlpha=.85;ctx.drawImage(shadowSpr,t.x-21,t.y-17,50,46);ctx.globalAlpha=1;} // soft baked shadow
  ctx.save();ctx.translate(t.x,t.y);
  if(!t.alive){const f=t.fallT,s=Math.max(.05,1-f/.9);ctx.rotate(f*9);ctx.scale(s*(.65+.35*Math.cos(f*12)),s);ctx.globalAlpha=Math.max(0,1-f/.9);}
  ctx.rotate(t.face+Math.PI/2);                                    // artwork faces up; pivot is the hull centre
  ctx.translate(0,t.rec*2);                                         // recoil: kick back along the barrel
  ctx.drawImage(img,-PIVX*TSC,-PIVY*TSC,TW*TSC,TH*TSC);
  if(t.flash>0){ctx.globalAlpha*=.7;ctx.drawImage(whiteSil,-PIVX*TSC,-PIVY*TSC,TW*TSC,TH*TSC);}
  ctx.restore();
  playerMark(t);
}
function playerMark(t){
  if(t.isPlayer&&t.alive){
    ctx.save();ctx.translate(t.x,t.y);ctx.setLineDash([6,5]);ctx.lineDashOffset=-time*18;
    ctx.strokeStyle='rgba(255,255,255,'+(.55+.25*Math.sin(time*6))+')';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,R+8,0,6.283);ctx.stroke();ctx.restore();
    const b=Math.sin(time*6)*1.5;
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(t.x,t.y-R-15+b);ctx.lineTo(t.x-5,t.y-R-23+b);ctx.lineTo(t.x+5,t.y-R-23+b);ctx.closePath();ctx.fill();ctx.stroke();
  }
}
function drawTankVec(t){ // fallback until the artwork has loaded
  const sp=tankSpr(t.color,t.dark);
  if(t.alive){ctx.globalAlpha=.85;ctx.drawImage(shadowSpr,t.x-21,t.y-17,50,46);ctx.globalAlpha=1;} // soft baked shadow, offset down-right
  ctx.save();ctx.translate(t.x,t.y);
  if(!t.alive){ // tumble: spin, squash, shrink, fade
    const f=t.fallT,s=Math.max(.05,1-f/.9);ctx.rotate(f*9);ctx.scale(s*(.65+.35*Math.cos(f*12)),s);ctx.globalAlpha=Math.max(0,1-f/.9);
  }
  ctx.rotate(t.hf);
  ctx.lineWidth=1.6;ctx.strokeStyle='#000';ctx.fillStyle='#131416';
  rr(-15,-14,30,7,3);ctx.fill();ctx.stroke();rr(-15,7,30,7,3);ctx.fill();ctx.stroke();       // tracks
  ctx.strokeStyle='#42454c';ctx.lineWidth=1;ctx.beginPath();                                  // animated treads
  for(let x=-13+(t.trk%4);x<15;x+=4){ctx.moveTo(x,-13.4);ctx.lineTo(x,-7.6);ctx.moveTo(x,7.6);ctx.lineTo(x,13.4);}
  ctx.stroke();
  ctx.drawImage(sp.hull,-22,-20,44,40);
  if(t.flash>0){ctx.fillStyle='rgba(255,255,255,.7)';rr(-12.5,-8.5,25,17,4);ctx.fill();}
  ctx.rotate(t.face-t.hf);                                                                    // turret leads, hull follows
  const bl=17-t.rec*5;                                                                        // barrel kicks back on firing
  ctx.fillStyle='#1d1f23';ctx.strokeStyle='#000';ctx.lineWidth=1.4;rr(7,-2.2,bl-7,4.4,1.4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2a2d33';rr(bl-4,-3.2,5,6.4,1.4);ctx.fill();ctx.stroke();
  ctx.drawImage(sp.tur,-15,-15,30,30);
  if(t.flash>0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(0,0,8,0,6.283);ctx.fill();}
  ctx.restore();
  playerMark(t);
}
function trackMarks(){ // fading tread marks on a persistent canvas (drawn at render rate, not sim rate)
  for(const t of tanks){
    if(!t.alive||t.sp<12||over(t)>-6){t.lm=null;continue;}
    const ox2=-Math.sin(t.face)*(tankReady?12.5:10.5),oy2=Math.cos(t.face)*(tankReady?12.5:10.5),l0=t.x+ox2,l1=t.y+oy2,r0=t.x-ox2,r1=t.y-oy2;
    if(t.lm){mctx.beginPath();mctx.moveTo(t.lm[0],t.lm[1]);mctx.lineTo(l0,l1);mctx.moveTo(t.lm[2],t.lm[3]);mctx.lineTo(r0,r1);mctx.stroke();}
    t.lm=[l0,l1,r0,r1];
  }
  if(++fadeN%4===0){mctx.globalCompositeOperation='destination-out';mctx.fillStyle='rgba(0,0,0,.035)';mctx.fillRect(CX-HX,CY-HY,2*HX,2*HY);mctx.globalCompositeOperation='source-over';}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#08080a';ctx.fillRect(0,0,canvas.width,canvas.height);
  const sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  ctx.setTransform(sc,0,0,sc,ox+sx*sc,oy+sy*sc);
  const tnow=performance.now()/1000;
  ctx.drawImage(bg,0,0,W,H);
  trackMarks();ctx.drawImage(marks,CX-HX,CY-HY,2*HX,2*HY,CX-HX,CY-HY,2*HX,2*HY); // marks only exist on the pad: blit just that rect
  drawLights(tnow,rh<rhT-0.5||rampFlash>0);
  drawRamps();
  for(const t of tanks)if(t.alive)drawTank(t);
  for(const s of shells){ // streak trail + glowing head
    const tx=s.x-s.vx*.05,ty=s.y-s.vy*.05;ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,200,90,.28)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.strokeStyle='#fff3b8';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(s.x-s.vx*.02,s.y-s.vy*.02);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.drawImage(glowSpr,s.x-9,s.y-9,18,18);
  }
  ctx.lineCap='butt';
  for(const t of tanks)if(!t.alive&&t.fallT<0.9)drawTank(t);
  for(const p of parts){
    const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;
    switch(p.k){
      case'ring':ctx.strokeStyle=p.c;ctx.lineWidth=1+3*a;ctx.beginPath();ctx.arc(p.x,p.y,p.r0+(p.r1-p.r0)*(1-a),0,6.283);ctx.stroke();break;
      case'smoke':{const z=p.sz*(1+(1-a)*p.gr);ctx.globalAlpha=a*p.al;ctx.drawImage(p.dust?dustSpr:smokeSpr,p.x-z/2,p.y-z/2,z,z);break;}
      case'glow':{const z=p.sz*(.6+.8*a);ctx.drawImage(glowSpr,p.x-z/2,p.y-z/2,z,z);break;}
      case'streak':ctx.strokeStyle=p.c;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.045,p.y-p.vy*.045);ctx.stroke();break;
      default:{const z=p.sz||3;ctx.fillStyle=p.c;ctx.fillRect(p.x-z/2,p.y-z/2,z,z);}
    }
  }
  ctx.globalAlpha=1;
  if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.4,flashT*0.4)+')';ctx.fillRect(0,0,W,H);}
}

// ---------- HUD ----------
let lastSig='',lastStatus='';
function hud(){
  const sig=tanks.map(t=>t.color+(t.alive?1:0)).join();
  if(sig!==lastSig){lastSig=sig;const n=tanks.filter(t=>t.alive).length,el=$('#pips');
    el.innerHTML=tanks.map(t=>'<i class="pip'+(t.isPlayer?' me':'')+(t.alive?'':' dead')+'" style="background:'+t.color+'"></i>').join('');
    el.setAttribute('aria-label','Tanks on pad: '+n);}
  const P=tanks[0];let s;
  if(state==='count')s='Get ready';
  else if(state==='over')s=playerWon?'Pad is yours':'Down the ramp';
  else if(P.alive&&onRamp(P))s='Climb!';
  else if(widenMsg>0)s='Ramps widen!';
  else s='Push them off';
  if(s!==lastStatus){lastStatus=s;$('#status').textContent=s;}
}

// ---------- flow ----------
function startGame(skip){
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
  reset();clearInput();$('#start').classList.add('hidden');$('#end').classList.add('hidden');
  if(skip===true){state='play';cdT=0;}else{state='count';cdT=3.6;}
}
let lastCd='';
function cdHud(){
  const el=$('#cd');
  if(cdT>0&&(state==='count'||state==='play')){
    const go=cdT<=0.6,txt=go?'GO!':String(Math.ceil(cdT-0.6));
    if(txt!==lastCd){lastCd=txt;el.textContent=txt;
      if(go){sfx.go();ring(CX,CY,10,230,'#f5c400',.5);glow(CX,CY,120,.25);spark(CX,CY,16,'#f5c400',220);shake=Math.max(shake,3);}else sfx.beep(+txt);
      el.className='';void el.offsetWidth;el.className=go?'go':'n';}
  }else if(lastCd!==''){lastCd='';el.classList.add('hidden');}
}
function buildSwatches(box){
  box.innerHTML='';
  for(const c of PALETTE){
    const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.setAttribute('aria-label','Tank colour '+c);
    b.innerHTML='<canvas width="52" height="84"></canvas>';
    b.addEventListener('click',e=>{e.currentTarget.blur();sfx.click();playerColor=c;if(state==='start')reset();markSwatches();});
    box.appendChild(b);
  }
}
function paintSwatches(){ // preview = the cached tinted tank (no re-tinting); flat dot until the artwork has loaded
  for(const b of document.querySelectorAll('.sw')){
    const cv=b.firstChild,g=cv.getContext('2d'),c=b.dataset.c;g.clearRect(0,0,cv.width,cv.height);
    if(tankReady&&tints[c]){const w=cv.width,h=w*TH/TW,s=Math.min(1,cv.height/h);g.imageSmoothingQuality='high';g.drawImage(tints[c],(w-w*s)/2,(cv.height-h*s)/2,w*s,h*s);}
    else{g.fillStyle=c;g.beginPath();g.arc(cv.width/2,cv.height/2,cv.width*.38,0,6.283);g.fill();}
  }
}
function markSwatches(){for(const b of document.querySelectorAll('.sw'))b.classList.toggle('sel',b.dataset.c===playerColor);}
buildSwatches($('#sw1'));buildSwatches($('#sw2'));paintSwatches();markSwatches();
function rematch(){startGame();}
$('#go').addEventListener('click',e=>{e.target.blur();audio();sfx.click();startGame();});
$('#again').addEventListener('click',e=>{e.target.blur();audio();sfx.click();rematch();});
for(const ev of ['pointerdown','keydown'])addEventListener(ev,audio,{passive:true});
function muteLabel(){const b=$('#mute');b.textContent=muted?'Sound off':'Sound on';b.classList.toggle('off',muted);}
$('#mute').addEventListener('click',e=>{e.target.blur();muted=!muted;try{localStorage.setItem('offramp-mute',muted?'1':'0');}catch(x){}muteLabel();audio();if(!muted)sfx.click();});
muteLabel();

// ---------- input ----------
const KEYMAP={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
function syncKeys(){
  input.kx=(keys.r?1:0)-(keys.l?1:0);
  input.ky=(keys.d?1:0)-(keys.u?1:0);
  input.fire=!!keys.space||fireTouch;
}
function clearInput(){ // drop every held key / stick / Fire; only a fresh press during play counts
  for(const k in keys)keys[k]=false;
  fireTouch=false;fb.classList.remove('on');stickEnd();
  input.kx=input.ky=input.jx=input.jy=0;input.fire=false;
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(KEYMAP[k]||k===' '||k==='Spacebar')e.preventDefault();
  if(KEYMAP[k]){if(state==='play'&&!e.repeat){keys[KEYMAP[k]]=true;syncKeys();}return;}
  if(k===' '||k==='Spacebar'){
    if(state==='start'){startGame();return;}
    if(state==='play'&&!e.repeat){keys.space=true;syncKeys();}
    return;
  }
  if(k==='Enter'||k==='r'||k==='R'){
    if(state==='start')startGame();
    else if(state==='over'&&!$('#end').classList.contains('hidden')&&performance.now()-overShownAt>400)rematch();
  }
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(KEYMAP[k]){keys[KEYMAP[k]]=false;syncKeys();}
  else if(k===' '||k==='Spacebar'){keys.space=false;syncKeys();}
});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;syncKeys();});

const isMobile=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
if(isMobile)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{passive:true,once:true});
// Landscape only on touch devices: upright shows the "Rotate your phone" screen (CSS) and the sim pauses.
const upright=()=>document.body.classList.contains('touch')&&innerHeight>innerWidth;
document.addEventListener('contextmenu',e=>e.preventDefault());

const stick=$('#stick'),knob=$('#knob');let stickId=null,fireTouch=false;
function stickMove(e){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width/2*0.9;
  let vx=e.clientX-cx,vy=e.clientY-cy;
  const m=Math.hypot(vx,vy);
  if(m>max){vx*=max/m;vy*=max/m;}
  knob.style.transform=`translate(${vx}px,${vy}px)`;
  const n=Math.min(m,max)/max;
  if(n<0.15){input.jx=input.jy=0;}
  else{const mag=Math.min(1,n/0.7),mm=Math.hypot(vx,vy)||1;input.jx=vx/mm*mag;input.jy=vy/mm*mag;}
}
function stickEnd(){stickId=null;input.jx=input.jy=0;knob.style.transform='translate(0,0)';}
stick.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
stick.addEventListener('pointerup',e=>{if(e.pointerId===stickId)stickEnd();});
stick.addEventListener('pointercancel',e=>{if(e.pointerId===stickId)stickEnd();});
const fb=$('#fire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;fb.setPointerCapture(e.pointerId);fireTouch=true;fb.classList.add('on');syncKeys();});
const fireEnd=()=>{fireTouch=false;fb.classList.remove('on');syncKeys();};
fb.addEventListener('pointerup',fireEnd);fb.addEventListener('pointercancel',fireEnd);

// ---------- loop ----------
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  if(upright())acc=0;
  while(acc>=1/60){step(1/60);acc-=1/60;}
  hud();cdHud();humUpdate();render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__off={step,reset,startGame:()=>startGame(true),startCount:()=>startGame(),input,get tanks(){return tanks;},get shells(){return shells;},get playerWon(){return playerWon;},get parts(){return parts;},get state(){return state;},get rh(){return rh;},CX,CY,HX,HY,RL,W,H,STUBS,over,mdist,mouths};
})();
</script>
